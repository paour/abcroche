name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Publish only from main; pull requests just prove the image builds.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional: tell your server to pull the new image and redeploy. Runs only
  # when the repository defines a DEPLOY_HOOK_URL variable and a
  # DEPLOY_HOOK_TOKEN secret (forks and other users skip it). It POSTs
  # {"pull": true} with the token as a bearer token, which suits Dockhand's
  # POST /api/stacks/<name>/deploy; any endpoint that accepts that works.
  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOOK_URL: ${{ vars.DEPLOY_HOOK_URL }}
      DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
    steps:
      - name: Deploy hook
        if: env.DEPLOY_HOOK_URL != '' && env.DEPLOY_HOOK_TOKEN != ''
        run: |
          set -o pipefail
          auth="Authorization: Bearer $DEPLOY_HOOK_TOKEN"
          out=$(curl -sS -N --fail-with-body --max-time 900 -X POST -H "$auth" \
            -H "Content-Type: application/json" -d '{"pull":true}' "$DEPLOY_HOOK_URL")
          job=$(printf '%s' "$out" | jq -r '.jobId // empty' 2>/dev/null || true)
          if [ -z "$job" ]; then
            # A hook that answers directly (or streams events): check its reply.
            printf '%s\n' "$out" | tail -n 20
            if printf '%s' "$out" | grep -q '"success":false'; then
              echo "::error::The deploy hook reported a failure"; exit 1
            fi
            exit 0
          fi
          # Dockhand runs the deploy as a background job: follow it to the end.
          jobs_url="${DEPLOY_HOOK_URL%%/api/*}/api/jobs/$job"
          for _ in $(seq 1 90); do
            st=$(curl -sS --fail-with-body --max-time 30 -H "$auth" "$jobs_url")
            status=$(printf '%s' "$st" | jq -r '.status')
            case "$status" in running|pending|queued|started) sleep 10 ;; *) break ;; esac
          done
          printf '%s' "$st" | jq -r '(.lines // [])[] | if type == "string" then . else tojson end' | tail -n 40
          echo "job $job: $status"
          if ! printf '%s' "$st" | jq -e '.result.success == true' >/dev/null; then
            echo "::error::Deploy job $job did not succeed ($status): $(printf '%s' "$st" | jq -c '.result')"
            exit 1
          fi
