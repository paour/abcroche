name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Publish only from main; pull requests just prove the image builds.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional: tell your server to pull the new image and redeploy. Runs only
  # when the repository defines a DEPLOY_HOOK_URL variable and a
  # DEPLOY_HOOK_TOKEN secret (forks and other users skip it). It POSTs
  # {"pull": true} with the token as a bearer token, which suits Dockhand's
  # POST /api/stacks/<name>/deploy; any endpoint that accepts that works.
  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOOK_URL: ${{ vars.DEPLOY_HOOK_URL }}
      DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
    steps:
      - name: Deploy hook
        if: env.DEPLOY_HOOK_URL != '' && env.DEPLOY_HOOK_TOKEN != ''
        run: |
          set -o pipefail
          # Dockhand streams progress as server-sent events; keep the tail.
          out=$(curl -sS -N --fail-with-body --max-time 900 -X POST \
            -H "Authorization: Bearer $DEPLOY_HOOK_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"pull":true}' "$DEPLOY_HOOK_URL")
          echo "$out" | tail -n 20
          if echo "$out" | grep -q '"success":false'; then
            echo "::error::The deploy hook reported a failure"
            exit 1
          fi
